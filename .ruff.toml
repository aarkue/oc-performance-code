line-length = 110
target-version = "py314"

[lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[lint.per-file-ignores]
# Side-effect imports populate the harness registry.
"ocpm_bench/cli.py" = ["F401"]
"ocpm_bench/run_one.py" = ["F401"]
"ocpm_bench/registrations.py" = ["F401"]
"tests/**/*.py" = ["F401"]
# The Cypher query strings in the Kuzu OCPQ impls are clearer kept intact
# than re-wrapped mid-query.
"ocpm_bench/patterns/ocpq/kuzu.py" = ["E501"]
