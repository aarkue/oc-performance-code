# Trace variants via PrimitiveAccess (same Python code on every model) on BPIC17.

repetitions: 2
matrix_passes: 1
randomize_cell_order: false
cell_timeout_seconds: 3600
results_path: results/variants_prim-small.jsonl

cells:
  - { model: linked_ocel, pattern: variants_prim, dataset: bpic17 }
  - { model: sqlite_mem, pattern: variants_prim, dataset: bpic17 }
  - { model: duckdb, pattern: variants_prim, dataset: bpic17 }
  - { model: kuzu, pattern: variants_prim, dataset: bpic17 }
  - { model: polars, pattern: variants_prim, dataset: bpic17 }
  - { model: pandas, pattern: variants_prim, dataset: bpic17 }
