# Small-scale KPI run on BPIC17.
# K1 = kpi_heatmap (activity x object-type joint distribution over E2O)
# K2 = kpi_conversion (Application -> Offer -> O_Accepted conversion rate)

repetitions: 1
matrix_passes: 1
randomize_cell_order: false
results_path: results/kpi-small.jsonl
cell_timeout_seconds: 900  # 15 minutes per cell; timed-out cells produce no row

cells:
  # K1
  - { model: linked_ocel, pattern: kpi_heatmap,    dataset: bpic17 }
  - { model: sqlite_mem,  pattern: kpi_heatmap,    dataset: bpic17 }
  - { model: duckdb,      pattern: kpi_heatmap,    dataset: bpic17 }
  - { model: kuzu,        pattern: kpi_heatmap,    dataset: bpic17 }
  - { model: polars,      pattern: kpi_heatmap,    dataset: bpic17 }
  - { model: pandas,      pattern: kpi_heatmap,    dataset: bpic17 }

  # K2
  - { model: linked_ocel, pattern: kpi_conversion, dataset: bpic17 }
  - { model: sqlite_mem,  pattern: kpi_conversion, dataset: bpic17 }
  - { model: duckdb,      pattern: kpi_conversion, dataset: bpic17 }
  - { model: kuzu,        pattern: kpi_conversion, dataset: bpic17 }
  - { model: polars,      pattern: kpi_conversion, dataset: bpic17 }
  - { model: pandas,      pattern: kpi_conversion, dataset: bpic17 }
