# OC-performance paper matrix on BPIC17.
# Sync = oc_perf_sync (per-event synchronization time + delaying object)
# Sojourn = oc_perf_sojourn (per-event sojourn time)

repetitions: 10
matrix_passes: 1
randomize_cell_order: true
cell_timeout_seconds: 3600
results_path: results/perf-paper.jsonl

cells:
  # Sync
  - { model: linked_ocel,  pattern: oc_perf_sync,     dataset: bpic17 }
  - { model: sqlite_mem,   pattern: oc_perf_sync,     dataset: bpic17 }
  - { model: duckdb,       pattern: oc_perf_sync,     dataset: bpic17 }
  - { model: kuzu,         pattern: oc_perf_sync,     dataset: bpic17 }
  - { model: neo4j_strong, pattern: oc_perf_sync,     dataset: bpic17 }
  - { model: polars,       pattern: oc_perf_sync,     dataset: bpic17 }
  - { model: pandas,       pattern: oc_perf_sync,     dataset: bpic17 }

  # Sojourn
  - { model: linked_ocel,  pattern: oc_perf_sojourn, dataset: bpic17 }
  - { model: sqlite_mem,   pattern: oc_perf_sojourn, dataset: bpic17 }
  - { model: duckdb,       pattern: oc_perf_sojourn, dataset: bpic17 }
  - { model: kuzu,         pattern: oc_perf_sojourn, dataset: bpic17 }
  - { model: neo4j_strong, pattern: oc_perf_sojourn, dataset: bpic17 }
  - { model: polars,       pattern: oc_perf_sojourn, dataset: bpic17 }
  - { model: pandas,       pattern: oc_perf_sojourn, dataset: bpic17 }
