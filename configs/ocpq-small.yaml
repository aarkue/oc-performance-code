# Small OCPQ matrix.

repetitions: 1
matrix_passes: 1
randomize_cell_order: false
cell_timeout_seconds: 900  # 15 minutes per cell; timed-out cells produce no row
results_path: results/ocpq-small.jsonl

cells:
  - { model: neo4j_strong, pattern: ocpq, dataset: bpic17 }
  - { model: linked_ocel, pattern: ocpq, dataset: bpic17 }
