# Light paper matrix: all patterns x {linked_ocel (rust4pm), duckdb, kuzu, polars}.
# Default-schema engines only -- drops sqlite/pandas/neo4j and the weak/strong_rels
# typing variants from paper-all.yaml. linked_ocel first (it is the oracle).

repetitions: 10
matrix_passes: 1
randomize_cell_order: true
cell_timeout_seconds: 3600
results_path: results/paper-light.jsonl

