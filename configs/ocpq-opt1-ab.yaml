# OCPQ A/B: duckdb vs polars vs linked_ocel(rust4pm), 2 reps.
# Note: linked_ocel OCPQ uses evaluate_ocpq (native PyObject return), NOT the
# call_binding JSON path, so OPT-1/orjson do not affect r4pm here.
repetitions: 2
matrix_passes: 1
randomize_cell_order: false
results_path: results/ocpq-opt1-ab.jsonl
cell_timeout_seconds: 1800

cells:
  - { model: duckdb,      pattern: ocpq, dataset: bpic17 }
  - { model: polars,      pattern: ocpq, dataset: bpic17 }
  - { model: linked_ocel, pattern: ocpq, dataset: bpic17 }
