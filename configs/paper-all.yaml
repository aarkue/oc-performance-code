# Combined paper matrix: all patterns x all engines, including the schema-typing
# variants. Per pattern: default-schema engines, plus the weak (sqlite_mem_weak,
# duckdb_weak, kuzu_weak) and strong-rels (sqlite_mem_strong_rels,
# duckdb_strong_rels) variants. The typing sub-study is a filtered view of these
# results: weak <-> default = node typing; default <-> strong_rels = edge typing.

repetitions: 10
matrix_passes: 1
randomize_cell_order: true
cell_timeout_seconds: 3600
results_path: results/paper-all.jsonl

cells:
  # DFG
  - { model: linked_ocel,             pattern: dfg,      dataset: bpic17 }
  - { model: duckdb,                  pattern: dfg,      dataset: bpic17 }
  - { model: duckdb_strong_rels,      pattern: dfg,      dataset: bpic17 }
  - { model: kuzu,                    pattern: dfg,      dataset: bpic17 }
  - { model: kuzu_weak,               pattern: dfg,      dataset: bpic17 }
  - { model: neo4j_strong,            pattern: dfg,      dataset: bpic17 }
  - { model: polars,                  pattern: dfg,      dataset: bpic17 }
  - { model: pandas,                  pattern: dfg,      dataset: bpic17 }
  - { model: sqlite_mem,              pattern: dfg,      dataset: bpic17 }
  - { model: sqlite_mem_strong_rels,  pattern: dfg,      dataset: bpic17 }
  - { model: sqlite_mem_weak,         pattern: dfg,      dataset: bpic17 }
  - { model: duckdb_weak,             pattern: dfg,      dataset: bpic17 }

  # Variants
