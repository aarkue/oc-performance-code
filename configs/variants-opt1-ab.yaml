# OPT-1 (Vec<u8> + orjson) A/B: duckdb vs polars vs linked_ocel(rust4pm), Variants, 2 reps.
repetitions: 2
matrix_passes: 1
randomize_cell_order: false
results_path: results/variants-opt1-ab.jsonl
cell_timeout_seconds: 900

cells:
  - { model: duckdb,      pattern: variants, dataset: bpic17 }
  - { model: polars,      pattern: variants, dataset: bpic17 }
  - { model: linked_ocel, pattern: variants, dataset: bpic17 }
